<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Forgot password · LifeFlow</title>
  <meta name="theme-color" content="#C62828" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/auth-extra.css" />
</head>
<body>
  <main class="page page--center" id="page">
    <section class="panel" aria-labelledby="title">
      <div class="card card--narrow">

        <!-- View 1: request form -->
        <div class="view" id="formView">
          <div class="mini-art" aria-hidden="true">
            <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="lockRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EF5350"/><stop offset="1" stop-color="#B71C1C"/></linearGradient>
                <radialGradient id="fpHalo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFCDD2" stop-opacity=".9"/><stop offset="1" stop-color="#FFCDD2" stop-opacity="0"/></radialGradient>
              </defs>
              <circle cx="100" cy="76" r="72" fill="url(#fpHalo)"/>
              <g class="bob">
                <rect x="36" y="38" width="128" height="84" rx="14" fill="#fff" stroke="#FFCDD2" stroke-width="3"/>
                <path d="m40 46 60 42 60-42" fill="none" stroke="#F3B5BA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="150" cy="40" r="26" fill="url(#lockRed)"/>
                <rect x="139" y="40" width="22" height="16" rx="4" fill="#fff"/>
                <path d="M143 40v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                <circle cx="150" cy="48" r="2.4" fill="#C62828"/>
              </g>
              <g fill="#E53935" opacity=".6"><circle class="tw t1" cx="26" cy="40" r="3.5"/><circle class="tw t2" cx="182" cy="108" r="3"/></g>
            </svg>
          </div>
          <header class="card__head">
            <h2 id="title">Forgot Your Password?</h2>
            <p>Don't worry! Enter your registered email address and we will help you reset your password.</p>
          </header>

          <div class="alert" id="formAlert" role="alert" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            <span id="formAlertText"></span>
          </div>

          <form id="forgotForm" novalidate>
            <div class="field">
              <label for="email">Email address</label>
              <div class="control">
                <svg class="control__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Enter your registered email" aria-describedby="email-err" />
              </div>
              <p class="error" id="email-err" aria-live="polite"></p>
            </div>
            <button class="btn" id="submitBtn" type="submit">
              <span class="btn__label">Send Reset Link</span>
              <span class="btn__spinner" aria-hidden="true"></span>
              <svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            </button>
          </form>
        </div>

        <!-- View 2: confirmation -->
        <div class="view" id="doneView" hidden>
          <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
          <header class="card__head">
            <h2>Check Your Email</h2>
            <p>If an account exists for</p>
            <span class="email-pill" id="sentTo"></span>
            <p class="plain-text" style="margin-top:12px">we've sent a link to reset your password. It may take a minute, and please check your spam folder too.</p>
          </header>
          <div class="stack">
            <button class="btn btn--outline" id="resendBtn" type="button"><span class="btn__label">Send again</span></button>
          </div>
        </div>

        <a class="link back" data-route="login" href="index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
          Back to Login
        </a>
      </div>
    </section>
  </main>

  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/forgot.js"></script>
</body>
</html>
